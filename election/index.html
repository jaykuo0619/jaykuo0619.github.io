<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 縣市長選情預測</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 一頁看懂：標題（席次）→ 拔河繩（得票）→ 方塊地圖（哪裡）→ 縣市卡（細節） */
:root{
  --bg:#f4f2ec; --paper:#fffdf8; --ink:#1c1f23; --muted:#646a70; --line:#dedad0; --soft:#ebe8df;
  --kmt:#1f4fa3; --dpp:#16834a; --tpp:#13979b; --ind:#7d64a8;
  --kmt-l:#a9c0e8; --dpp-l:#9fd6b4; --tpp-l:#93d6d8; --ind-l:#c3b2de;
  --kmt-m:#5b84cf; --dpp-m:#4fae76; --tpp-m:#45b6b9; --ind-m:#9a83c2;
  --focus:#c47b00;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --paper:#1b1e23; --ink:#ecebe6; --muted:#9ea3a9; --line:#2e3238; --soft:#24282e;
  --kmt:#6f9cf0; --dpp:#47c784; --tpp:#3fcfd2; --ind:#b49ce0;
  --kmt-l:#2a3d66; --dpp-l:#1e4a33; --tpp-l:#1c4a4b; --ind-l:#3d3357;
  --kmt-m:#3f67c0; --dpp-m:#2c8a57; --tpp-m:#24898b; --ind-m:#6a54a0;
  --focus:#ffb52e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --paper:#1b1e23; --ink:#ecebe6; --muted:#9ea3a9; --line:#2e3238; --soft:#24282e;
  --kmt:#6f9cf0; --dpp:#47c784; --tpp:#3fcfd2; --ind:#b49ce0;
  --kmt-l:#2a3d66; --dpp-l:#1e4a33; --tpp-l:#1c4a4b; --ind-l:#3d3357;
  --kmt-m:#3f67c0; --dpp-m:#2c8a57; --tpp-m:#24898b; --ind-m:#6a54a0;
  --focus:#ffb52e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--line)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.g{color:var(--dpp)} .b{color:var(--kmt)}

/* 1. 標題 */
.kicker{font-size:13px;letter-spacing:.08em;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6.4vw,58px);line-height:1.15;margin:8px 0 10px;letter-spacing:.01em;text-wrap:balance}
h1 .nw{white-space:nowrap}
h1 .seat{font-family:var(--f-num);font-weight:600;font-size:1.08em}
.sub{font-size:clamp(15px,2.2vw,18px);margin:0;max-width:44em;text-wrap:pretty}
.sub button{font:inherit;border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--focus);text-underline-offset:4px;cursor:pointer}

/* 2. 拔河繩 */
.rope{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px clamp(16px,3vw,28px) 18px}
.sides{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.side .who{font-weight:700;font-size:15px}
.side .pct{font-family:var(--f-num);font-weight:600;font-size:clamp(34px,7vw,56px);line-height:1}
.side .v{font-size:13px;color:var(--muted)}
.side.r{text-align:right}
.track{position:relative;height:64px;margin:14px 0 4px}
.cord{position:absolute;left:0;right:0;top:30px;height:8px;border-radius:4px;
  background:repeating-linear-gradient(115deg,color-mix(in srgb,var(--ink) 30%,transparent) 0 3px,color-mix(in srgb,var(--ink) 12%,transparent) 3px 7px)}
.zone{position:absolute;top:22px;height:24px;border-radius:12px;opacity:.14}
.mid{position:absolute;left:50%;top:14px;height:40px;border-left:2px dashed var(--muted)}
.midl{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.knot{position:absolute;top:34px;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--ink);border:4px solid var(--paper);box-shadow:0 0 0 2px var(--ink);transition:left .35s}
.ghost{position:absolute;top:34px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px dashed var(--muted);background:var(--paper)}
.tag{position:absolute;top:52px;transform:translateX(-50%);font-size:12px;white-space:nowrap}
.arrow{position:absolute;top:34px;height:0;border-top:2px solid var(--focus);transition:all .35s}
.arrow::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.arrow.toL::after{left:-2px;border-right:8px solid var(--focus);border-left:0}
.arrow.toR::after{right:-2px;border-left:8px solid var(--focus);border-right:0}
.rope .cap{font-size:14px;margin:18px 0 0;text-align:center;text-wrap:balance}

/* 3. 方塊地圖＋縣市卡 */
.board{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
@media (min-width:780px){.board{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.mapcol{display:flex;flex-direction:column;gap:14px}
.mapcol h2,.card h2{font-family:var(--f-display);font-weight:900;margin:0;font-size:22px}
.tiles{container-type:inline-size;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;max-width:520px;width:100%;margin:0 auto}
.tile{aspect-ratio:1;position:relative;border:0;border-radius:10px;cursor:pointer;font:inherit;color:#fff;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;transition:transform .15s,background .35s;line-height:1.15}
.tile:hover{transform:scale(1.04)}
.tile .nm{font-weight:900;font-size:clamp(11px,4.3cqi,21px)}
@container (max-width:340px){.tile .ld{display:none}}
.tile .ld{font-size:clamp(10px,2.5cqi,13px);opacity:.92;white-space:nowrap}
.tile.light{color:var(--ink)}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.tile .was{position:absolute;top:0;right:0;width:36%;height:36%;clip-path:polygon(0 0,100% 0,100% 100%);box-shadow:none}
.tile .was::before{content:"";position:absolute;inset:0}
.isle{font-size:11px;color:var(--muted);align-self:end;justify-self:center;grid-column:1}
.key{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);justify-content:center}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:16px;height:16px;border-radius:4px;display:inline-block;position:relative;overflow:hidden}
.time{display:flex;align-items:center;gap:10px;max-width:520px;width:100%;margin:0 auto}
.time input{flex:1;accent-color:var(--ink)}
.time .d{font-family:var(--f-num);font-weight:600;min-width:3.4em;text-align:right}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
@media (min-width:780px){.card{position:sticky;top:16px}.card .x{display:none}}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{font:inherit;font-size:22px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px}
.verdict{font-size:18px;margin:-6px 0 0}
.verdict .wp{font-family:var(--f-num);font-weight:600}
.h2h{display:flex;flex-direction:column;gap:6px}
.h2h .lab{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.h2h .names{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.h2h .names b{font-weight:700}
.h2h .names .p{font-family:var(--f-num);font-weight:600;font-size:20px}
.h2h .names .r{text-align:right}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;position:relative;background:var(--soft)}
.split i{display:block;height:100%;transition:width .35s}
.split .half{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:2px solid var(--paper)}
.h2h .votes{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.h2h.past{opacity:.75}
.h2h.past .names .p{font-size:16px}
.swing{font-size:15px;background:var(--soft);border-radius:10px;padding:10px 12px;text-wrap:pretty}
.spark svg{width:100%;height:auto;display:block}
.spark text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.more{font-size:14px;font-weight:700}
.news h3{font-size:15px;margin:0 0 4px;font-family:var(--f-display)}
.news .net{font-size:13px;color:var(--muted);margin:0 0 8px}
.news ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.news li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:4px 10px;align-items:start;font-size:14px;line-height:1.45}
.news .dt{font-family:var(--f-num);font-size:12.5px;color:var(--muted);padding-top:1px}
.news .who{font-weight:700}
.news .fx{font-family:var(--f-num);font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap;text-align:right}
.news .fx small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.news .up{background:color-mix(in srgb,var(--dpp) 14%,transparent);color:var(--dpp)}
.news .dn{background:color-mix(in srgb,#c2410c 14%,transparent);color:#c2410c}
.news a{font-size:12px;color:var(--muted)}
.ptag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px;color:var(--muted);white-space:nowrap}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:0}
@media (min-width:780px){.hint{display:none}}
/* 手機：縣市卡改成從底部滑出的面板 */
@media (max-width:779px){
  .card{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:18px 18px 0 0;max-height:78vh;overflow:auto;
    padding:16px max(16px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .28s ease}
  .card.open{transform:none}
  .card::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 0}
}
footer{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
footer p{margin:0;max-width:62em}
footer .full{font-size:16px;font-weight:700;color:var(--ink)}

/* ===== 一個畫面放得下：頁面本身不捲動，縣市卡內部可捲 ===== */
html,body{height:100%}
body{height:100dvh;overflow:hidden;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.wrap{height:100%;max-width:1440px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"h" "r" "m" "f"}
header{grid-area:h;min-width:0} .rope{grid-area:r;min-width:0} .mapcol{grid-area:m} .card{grid-area:c} footer{grid-area:f}
.board{display:contents}
.mapcol{min-height:0;min-width:0;gap:6px}
.tilebox{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.tiles{width:min(100cqw,calc(100cqh * 5 / 6));aspect-ratio:5/6;max-width:none;grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-rows:auto;margin:0}
.tile{aspect-ratio:auto;border-radius:8px}
h1{font-size:clamp(22px,min(6.6vw,4.4vh),46px);margin:2px 0 4px}
.kicker{font-size:12px}
.kicker a{font-weight:700;color:var(--ink)}
.sub{font-size:clamp(13px,min(3.6vw,1.9vh),16px);line-height:1.5}
.rope{padding:10px 16px 10px;border-radius:12px}
.side .who{font-size:13px}
.side .pct{font-size:clamp(24px,min(7vw,4.6vh),46px)}
.side .v{font-size:11.5px}
.track{margin:4px 0 0;height:68px}
.rope .cap{margin:2px 0 0;font-size:12.5px}
.key{font-size:11px;gap:2px 12px}
.key i{width:12px;height:12px;border-radius:3px}
.mapcol h2{font-size:17px}
.time{max-width:none}
footer{padding-top:6px;font-size:11.5px;display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:4px 14px;flex-wrap:wrap}
footer .full{font-size:13.5px}
@media (max-width:779px){
  .mapcol h2,.hint,.kicker .u,.sub .fl,.rope .cap,.side .v{display:none}
  .sub .fs{display:inline!important}
  h1{font-size:clamp(20px,6.4vw,30px)}
  .track{height:56px;margin:0}
  .rope{padding:8px 14px 4px}
  .key{font-size:10.5px}
  .find .kbd{display:none}
  .tiles{--sc:1}
  .time{gap:6px}
  .time .btn,.dimbtn,.find{padding:5px 10px}
  footer .note{display:none}
  .card{max-height:82dvh}
}
@media (min-width:780px){
  .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"h h" "r r" "m c" "f f";gap:12px 20px}
  .card{position:static;height:100%;min-height:0;overflow:auto;padding:16px;gap:12px}
}
@media (min-width:1080px),(min-width:780px) and (min-aspect-ratio:5/4){
  .wrap{grid-template-columns:minmax(260px,.92fr) minmax(0,1.1fr) minmax(340px,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"h m c" "r m c" "f m c";gap:16px 26px}
  h1{font-size:clamp(28px,min(2.9vw,5.2vh),48px)}
  .sub{font-size:clamp(13.5px,1.9vh,16px)}
  .side .pct{font-size:clamp(28px,min(2.8vw,5vh),46px)}
  footer{align-self:end;flex-direction:column;align-items:flex-start;border-top:1px solid var(--line)}
}
/* 太矮的畫面（手機橫放等）放不下時，退回可捲動 */
@media (max-height:500px){
  html,body{height:auto} body{overflow:auto} .wrap{height:auto} .tilebox{height:min(90vw,520px);flex:none}
}

/* ===== 3D 立體柱狀地圖：柱子越高＝勝率越穩；可拖曳旋轉、手機可傾斜 ===== */
.tile{background:none!important}
.tile .top{position:absolute;inset:0;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;overflow:hidden;transition:background .35s}
.tile .sd{display:none}
.tilebox{position:relative}
.is3d .tilebox{perspective:1100px;cursor:grab;touch-action:none}
.is3d .tilebox.drag{cursor:grabbing}
.is3d .tiles{transform-style:preserve-3d;transform:rotateX(var(--rx,50deg)) rotateZ(var(--rz,-12deg)) scale(var(--sc,.86));transition:transform .25s ease-out}
.is3d .tilebox.drag .tiles{transition:none}
.is3d .tile{transform-style:preserve-3d;overflow:visible;border-radius:3px;transform:translateZ(var(--h,0px));transition:transform .7s cubic-bezier(.34,1.35,.64,1)}
.is3d .tile:hover{transform:translateZ(calc(var(--h,0px) + 10px))}
.is3d .tile.sel{outline:none;transform:translateZ(calc(var(--h,0px) + 18px))}
.is3d .tile.sel .top{box-shadow:0 0 0 3px var(--ink),0 0 18px var(--focus)}
.is3d .tile .sd{display:block;position:absolute;background:var(--side)}
.is3d .tile .s1{left:0;right:0;top:100%;height:var(--h,0px);transform-origin:top;transform:rotateX(-90deg);filter:brightness(.72)}
.is3d .tile .s2{top:0;bottom:0;left:100%;width:var(--h,0px);transform-origin:left;transform:rotateY(90deg);filter:brightness(.56)}
.is3d .tile .s3{top:0;bottom:0;right:100%;width:var(--h,0px);transform-origin:right;transform:rotateY(-90deg);filter:brightness(.85)}
.is3d .tile .s4{left:0;right:0;bottom:100%;height:var(--h,0px);transform-origin:bottom;transform:rotateX(90deg);filter:brightness(.6)}
.is3d .tile:hover{transform:translateZ(calc(var(--h,0px) + 10px))}
.dimbtn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.dimbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rot-hint{position:absolute;right:4px;bottom:2px;font-size:11px;color:var(--muted);pointer-events:none;opacity:.9}
:not(.is3d)>.wrap .rot-hint{display:none}
.knot{transition:left .8s cubic-bezier(.34,1.56,.64,1)!important}
@media (prefers-reduced-motion:reduce){.is3d .tile,.is3d .tiles{transition:none}}

/* ===== 互動細節：玻璃質感、游標聚光、指令面板、View Transitions ===== */
.is3d .tiles{gap:10px}
.is3d .tile::after{content:"";position:absolute;inset:6%;transform:translateZ(calc(-1 * var(--h,0px)));background:rgba(0,0,0,.18);filter:blur(6px);border-radius:6px;pointer-events:none}
.rope{position:relative}
@media (min-width:780px){.card{position:relative!important;top:0!important}}
.rope::before,.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--focus) 12%,transparent),transparent 60%)}
.rope:hover::before,.card:hover::after{opacity:1}
.card{overflow:auto}
@media (max-width:779px){.card{background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.card{view-transition-name:card}
.kbd{font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--paper)}
.palette{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette .box{width:min(520px,92vw);background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.palette input{width:100%;font:inherit;font-size:18px;border:0;border-bottom:1px solid var(--line);padding:14px 16px;background:transparent;color:var(--ink);outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px}
.palette li[aria-selected="true"]{background:var(--soft)}
.palette li .m{font-size:12.5px;color:var(--muted)}
.find{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}

.polls h3{font-size:15px;margin:0 0 4px;font-family:var(--f-display)}

  const dg=st.G-SEATS22.G, db=st.B-SEATS22.B, fl=C.filter(c=>flipped(c,day));
  const n = x => x>0?`多 ${x}`:x<0?`少 ${-x}`:'持平';
  document.getElementById('sub').innerHTML = `和 2022 年比，綠營${n(dg)}${dg?' 席':''}、藍營${n(db)}${db?' 席':''}${st.O?`，其他 ${st.O} 席`:''}。`+
    (fl.length? `<span class="fl">可能翻盤的有 ${fl.length} 個縣市：${fl.map(c=>`<button type="button" data-c="${c}">${short(c)}</button>`).join('、')}。</span><span class="fs" style="display:none">${fl.length} 個縣市可能翻盤（方塊右上角三角形）。</span>` : '目前沒有縣市翻盤。');
  document.querySelectorAll('#sub button').forEach(b=>b.addEventListener('click',()=>open(b.dataset.c)));
}

// ===== 2. 拔河繩 =====
function drawRope(){
  const n=DATA.national[day], g=n.vg, b=n.vb, pg=DATA.prev_national.D, pb=DATA.prev_national.K;
  countTo('pg',g); countTo('pb',b);
  document.getElementById('vg').textContent = `約 ${wan(VALID*g/100)}票・2022 ${pct(pg)}%`;
  document.getElementById('vb').textContent = `約 ${wan(VALID*b/100)}票・2022 ${pct(pb)}%`;
  // 繩結位置：綠營領先就往左拉，藍營領先往右；±15 點拉到底
  const X = d => 50 - Math.max(-15,Math.min(15,d))/15*45;
  const now=X(g-b), was=X(pg-pb);
  const set=(id,x)=>document.getElementById(id).style.left=x+'%';
  set('knot',now); set('ktag',now); set('ghost',was); set('gtag',was);
  const ar=document.getElementById('arrow'); const lo=Math.min(now,was), hi=Math.max(now,was);
  ar.style.left=(lo+(now<was?1.5:1))+'%'; ar.style.width=Math.max(0,hi-lo-3)+'%'; ar.className='arrow '+(now<was?'toL':'toR');
  // 標籤太近時錯開
  document.getElementById('gtag').style.top = Math.abs(now-was)<9? '-4px':'52px';
  const lead = g>b? `綠營領先 ${pct(g-b)} 點` : `藍營領先 ${pct(b-g)} 點`;
  const move = (g-b)-(pg-pb);
  document.getElementById('cap').innerHTML = `22 縣市合計，${lead}。和 2022 年藍營領先 ${pct(pb-pg)} 點相比，繩子往<b class="${move>0?'g':'b'}">${move>0?'綠營':'藍營'}拉過去 ${pct(Math.abs(move))} 點</b>。`;
}

// ===== 4. 縣市卡 =====
function h2h(lab,a,pa,va,b,pb,vb,votes,past){
  const tot=va+vb;
  return `<div class="h2h${past?' past':''}"><div class="lab"><span>${lab}</span></div>
    <div class="names"><span><b>${esc(a)}</b> <span class="muted" style="font-size:12.5px">${PARTY[pa]}</span><br><span class="p" style="color:var(--${PV[pa]})">${pct(va)}%</span></span>
      <span class="r"><b>${esc(b)}</b> <span class="muted" style="font-size:12.5px">${PARTY[pb]}</span><br><span class="p" style="color:var(--${PV[pb]})">${pct(vb)}%</span></span></div>
    <div class="split"><i style="width:${va/tot*100}%;background:var(--${PV[pa]})"></i><i style="width:${vb/tot*100}%;background:var(--${PV[pb]})"></i><span class="half"></span></div>
    ${votes?`<div class="votes"><span>約 ${wan(votes[0])}票</span><span>約 ${wan(votes[1])}票</span></div>`:''}</div>`;
}
function spark(c,W){
  const r=DATA.races[c], [a,b]=top2(c,N-1), pa=cand(c,a).p, pb=cand(c,b).p;
  const ms=r.series.map(s=>s.s[a]-s.s[b]); const mx=Math.max(8,...ms.map(Math.abs))*1.1;
  const H=120, L=4, R=4, T=18, B=18, x=i=>L+(W-L-R)*i/(N-1), y=v=>T+(H-T-B)*(1-(v+mx)/(2*mx));
  const pts=ms.map((m,i)=>`${x(i).toFixed(1)},${y(m).toFixed(1)}`).join(' ');
  const area=`${x(0)},${y(0)} ${pts} ${x(N-1)},${y(0)}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c} 6/1 以來的差距走勢">
    <defs><clipPath id="up"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="dn"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath></defs>
    <polygon points="${area}" fill="var(--${PV[pa]})" opacity=".25" clip-path="url(#up)"/><polygon points="${area}" fill="var(--${PV[pb]})" opacity=".25" clip-path="url(#dn)"/>
    <line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
    <line x1="${x(day)}" x2="${x(day)}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-dasharray="2 3" opacity=".5"/>
    ${r.events.filter(e=>e.i0<=day).map(e=>{ const cx=x(e.i0), cy=y(ms[e.i0]), up=e.k>0; const col=`var(--${PV[cand(c,e.n).p]})`;
      return `<path d="M${cx-5},${up?cy-9:cy+9} L${cx+5},${up?cy-9:cy+9} L${cx},${up?cy-3:cy+3} Z" transform="rotate(${up?180:0} ${cx} ${up?cy-6:cy+6})" fill="${col}"><title>${fmtD(e.d)} ${esc(e.n)}：${esc(e.t)}</title></path>`; }).join('')}
    <circle cx="${x(day)}" cy="${y(ms[day])}" r="4.5" fill="var(--${PV[ms[day]>=0?pa:pb]})" stroke="var(--paper)" stroke-width="2"/>
    <text x="${L}" y="12" style="fill:var(--${PV[pa]});font-weight:700">↑ ${esc(a)} 領先</text><text x="${L}" y="${H-3}" style="fill:var(--${PV[pb]});font-weight:700">↓ ${esc(b)} 領先</text>
    <text x="${W-R}" y="12" text-anchor="end">6/1 → ${fmtD(r.series[day].d)}</text></svg>`;
}
// 新聞影響：每則新聞讓該候選人得票率變動幾點（拿掉這則新聞重算後相減）
function fx(e){ const k=day-e.i0; return k<0? null : e.eff[Math.min(k,e.eff.length-1)]; }
function newsBlock(c){
  const r=DATA.races[c], ev=r.events.filter(e=>e.i0<=day).sort((a,b)=>b.i0-a.i0);
  if (!ev.length) return `<div class="news"><h3>影響選情的新聞與民調</h3><p class="net">${fmtD(DATA.national[day].d)} 前沒有足以影響選情的重大新聞，這裡的預測只來自民調與基準。</p></div>`;
  const net={}; ev.forEach(e=>{ net[e.n]=(net[e.n]||0)+fx(e); });
  const sg=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(1);
  const netTxt=Object.entries(net).filter(([,v])=>Math.abs(v)>=0.05).map(([n,v])=>`<b style="color:var(--${PV[cand(c,n).p]})">${esc(n)}</b> ${sg(v)} 點`).join('、');
  return `<div class="news"><h3>影響選情的新聞與民調</h3>
    <p class="net">${netTxt?`到 ${fmtD(DATA.national[day].d)} 為止，新聞合計讓 ${netTxt}（得票率）。`:'這些新聞的影響目前都已消退。'}影響會隨時間淡化，之後的民調會把真正留下來的效果算進去。</p>
    <ul>${ev.map(e=>{ const now=fx(e), peak=e.eff.slice(0,day-e.i0+1).reduce((m,v)=>Math.abs(v)>Math.abs(m)?v:m,0);
      return `<li><span class="dt">${fmtD(e.d)}</span><span>${e.ty==='poll'?'<span class="ptag">民調公布</span>':''}<span class="who" style="color:var(--${PV[cand(c,e.n).p]})">${esc(e.n)}</span> ${esc(e.t)}${e.url?` <a href="${esc(e.url)}" target="_blank" rel="noopener">來源</a>`:''}</span>
        <span class="fx ${now>=0?'up':'dn'}">${sg(now)} 點<small>最大 ${sg(peak)}</small></span></li>`; }).join('')}</ul></div>`;
}
// 民調採納：每份民調的權重與校正（和模型同一套算法）
const TW={phone:1,online:.6,ai:.35}, TN={phone:'電話',online:'網路問卷',ai:'AI 模擬'};
function pollW(p,d){ const age=(new Date(d)-new Date(p.fe))/864e5; const sz=p.n? Math.sqrt(Math.min(Math.max(p.n,400),2000)/1000):0.8;
  return {w:TW[p.t]*(p.sp?0.7:1)*sz*(p.q||1)*(p.cf||1)*Math.exp(-age/40), age:Math.round(age), sz}; }
// AI 方法評分（0–100）與趨勢一致性標籤
const QS=q=>Math.round(Math.min(100,(q||1)/1.1*100));
function trendTag(p){ if(p.dev==null) return '<span>無同期他家民調可對照</span>';
  const a=Math.abs(p.dev), dir=p.dev>0?'綠':'藍';
  if(a<4) return `<span class="good">符合趨勢（差 ${a.toFixed(1)} 點）</span>`;
  return `<span class="bad">${a<8?'略偏':'偏離'}趨勢：比共識偏${dir} ${a.toFixed(1)} 點${p.cf<1?' ×'+p.cf.toFixed(2):''}</span>`; }
function pollBlock(c){
  const r=DATA.races[c], s=r.series[day], d=s.d;
  const base = r.fund_og!=null? `AI 判斷與「2022 結果＋全國擺盪 ${(DATA.method.swing>0?'往藍 ':'往綠 ')+Math.abs(DATA.method.swing).toFixed(1)} 點」各半` : 'AI 判斷（缺少藍綠對照，無法套用 2022 擺盪）';
  const ps=r.polls.filter(p=>p.rel<=d);
  if (!ps.length) return `<div class="polls"><h3>民調怎麼被採納</h3><p class="net">${fmtD(d)} 前沒有公開民調，預測完全來自基準：${base}。</p></div>`;
  const W=ps.map(p=>({p,...pollW(p,d)})), tot=W.reduce((x,o)=>x+o.w,0);
  W.sort((x,y)=>y.w-x.w);
  const rows=W.map(o=>{ const p=o.p, share=o.w/tot*100;
    const res=Object.entries(p.v).map(([n,v])=>`${esc(n)} ${v}`).join('：');
    const why=[`<span${p.t!=='phone'?' class="bad"':''}>${TN[p.t]}${p.t==='phone'?'':' ×'+TW[p.t]}</span>`,
      p.sp?`<span class="bad">${p.sp==='K'?'國民黨':'民進黨'}相關委託 ×0.7</span>`:'',
      `<span${o.sz<1?' class="bad"':''}>樣本 ${p.n?p.n.toLocaleString():'未載明'}${o.sz.toFixed(2)!=='1.00'?' ×'+o.sz.toFixed(2):''}</span>`,
      `<span${o.age>40?' class="bad"':''}>${o.age} 天前 ×${Math.exp(-o.age/40).toFixed(2)}</span>`,
      Math.abs(p.he)>=0.3?`<span class="bad">${esc(p.house)} 平均偏${p.he>0?'綠':'藍'} ${Math.abs(p.he).toFixed(1)} 點，已校正</span>`:'',
      `<span class="${QS(p.q)>=85?'good':QS(p.q)<65?'bad':''}">AI 方法評分 ${QS(p.q)}｜${esc(p.frn||'')} ×${(p.q||1).toFixed(2)}</span>`, trendTag(p)].join('');
    return `<li><span><span class="org">${esc(p.org)}</span> <span class="res">${fmtD(p.fe)}｜${res}</span></span><span class="wt">${share.toFixed(0)}%</span>
      <span class="wbar"><i style="width:${share}%"></i></span><span class="why">${why}</span>${p.note?`<span class="aud">${esc(p.note)}</span>`:''}</li>`; }).join('');
  return `<div class="polls"><h3>民調怎麼被採納</h3>
    <p class="net">這天的預測有 <b>${Math.round(s.pw*100)}%</b> 來自民調、${100-Math.round(s.pw*100)}% 來自基準（${base}）。右邊百分比是每份民調在民調部分占的權重：電話調查、非政黨委託、樣本大、越新的權重越高；機構若長期比同期其他民調偏藍或偏綠，先扣掉偏差再算。每份民調另經 AI 查核抽樣方式、加權、揭露程度與未表態比例給方法分，和同期他家差太多的也會降權。</p>
    <ul>${rows}</ul></div>`;
}
function drawCard(){
  const card=document.getElementById('card'); const c=sel||'台北市';
  const r=DATA.races[c], s=r.series[day], pv=r.prev, to=r.turnout, [a,b]=top2(c,day);
  const pa=cand(c,a).p, pb=cand(c,b).p, wp=Math.round(s.wp*100);
  const word = s.wp<0.6?'難分勝負，暫時領先':s.wp<0.85?'小幅領先':'穩定領先';
  const others=Object.keys(s.s).filter(n=>n!==a&&n!==b).reduce((t,n)=>t+s.s[n],0);
  // 2022 → 2026 的差距變化（在野最高票減民進黨最高票）
  let sw='';
  const d22 = pv.w[2]-pv.r[2];
  const was = `2022 年 <b>${esc(pv.w[0])}</b>（${PARTY[pv.w[1]]}）贏 ${pct(d22)} 點`;
  const now = `現在 <b>${esc(s.lead)}</b>（${PARTY[cand(c,s.lead).p]}）領先 ${pct(s.m)} 點`;
  if (pv.m!=null && s.og!=null){ const v=s.og-pv.m; sw = `${was}；${now}。<b class="${v<0?'g':'b'}">往${v<0?'綠營':'藍營'}移動 ${pct(Math.abs(v))} 點</b>${flipped(c,day)?'，<b style="color:var(--focus)">可能翻盤</b>':''}。`; }
  else sw = `${was}；${now}。${s.og==null?'本屆沒有民進黨候選人。':''}`;
  const W = Math.max(260, Math.min(560, card.clientWidth-40 || 360));
  card.innerHTML = `<div class="chead"><h2>${c}</h2><button type="button" class="x" aria-label="關閉">✕</button></div>
    <p class="verdict"><b style="color:var(--${PV[cand(c,s.lead).p]})">${esc(s.lead)}</b> ${word}，勝率 <span class="wp">${wp}%</span></p>
    ${h2h(`${fmtD(s.d)} 預測（11/28 預估票數）`,a,pa,s.s[a],b,pb,s.s[b],[to.valid*s.s[a]/100,to.valid*s.s[b]/100])}
    ${others>0.5?`<div class="muted" style="font-size:12.5px;margin-top:-8px">其他候選人合計 ${pct(others)}%</div>`:''}
    ${h2h('2022 實際結果',pv.w[0],pv.w[1],pv.w[2],pv.r[0],pv.r[1],pv.r[2],null,true)}
    <div class="swing">${sw}</div>
    <div class="spark"><div class="muted" style="font-size:12.5px;margin-bottom:4px">6/1 以來兩人差距（▼▲ 為重大新聞）</div>${spark(c,W)}</div>
    ${pollBlock(c)}
    ${newsBlock(c)}
    <div class="facts"><span>預估投票率 <b>${pct(to.t)}%</b>（2022 ${pct(pv.t)}%）</span><span>預估 <b>${wan(to.electorate*to.t/100)}</b>人投票</span><span>民調 ${r.npolls} 份</span></div>
    <a class="more" href="full.html">${c}的民調與完整走勢 →</a>`;
  card.querySelector('.x').addEventListener('click',()=>{ card.classList.remove('open'); });
}

// ===== 3D：柱高、拖曳旋轉、手機傾斜、開場升起動畫 =====
let dragged=false, intro=true, is3d=true, rx=50, rz=-12, tiltX=0, tiltZ=0;
try{ const v=localStorage.getItem('dim'); if(v==='2d') is3d=false; }catch(e){}
const tbox=document.getElementById('tilebox');
function colH(wp){ const w=(tiles.querySelector('.tile')||{}).offsetWidth||60; return Math.round(w*(0.1+0.5*Math.max(0,Math.min(1,(wp-0.5)*2))))+'px'; }
function applyRot(){ tiles.style.setProperty('--rx',(rx+tiltX)+'deg'); tiles.style.setProperty('--rz',(rz+tiltZ)+'deg'); }
function setDim(v){ is3d=v; document.body.classList.toggle('is3d',v); const b=document.getElementById('dim'); b.setAttribute('aria-pressed',v); b.textContent=v?'3D':'2D';
  try{localStorage.setItem('dim',v?'3d':'2d');}catch(e){} }
document.getElementById('dim').addEventListener('click',()=>{ setDim(!is3d); askTilt(); });
let p0=null;
tbox.addEventListener('pointerdown',e=>{ if(!is3d) return; p0={x:e.clientX,y:e.clientY,rx,rz}; dragged=false; });
addEventListener('pointermove',e=>{ if(!p0) return; const dx=e.clientX-p0.x, dy=e.clientY-p0.y;
  if(!dragged && Math.hypot(dx,dy)>6){ dragged=true; tbox.classList.add('drag'); }
  if(dragged){ rz=p0.rz+dx*0.35; rx=Math.max(0,Math.min(68,p0.rx-dy*0.3)); applyRot(); } });
addEventListener('pointerup',()=>{ if(!p0) return; p0=null; tbox.classList.remove('drag'); setTimeout(()=>dragged=false,0); });
tbox.addEventListener('dblclick',()=>{ rx=50; rz=-12; applyRot(); });
// 手機傾斜（iOS 需要使用者點一下才能授權）
let tiltOn=false;
function onTilt(e){ if(e.beta==null) return; tiltX=Math.max(-12,Math.min(12,(e.beta-45)*0.25)); tiltZ=Math.max(-15,Math.min(15,e.gamma*0.35)); if(is3d) applyRot(); }
function askTilt(){ if(tiltOn || !('DeviceOrientationEvent' in window)) return;
  const go=()=>{ tiltOn=true; addEventListener('deviceorientation',onTilt); };
  if (typeof DeviceOrientationEvent.requestPermission==='function') DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted') go(); }).catch(()=>{});
  else go(); }
if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission!=='function') askTilt();
else tbox.addEventListener('touchstart',askTilt,{once:true,passive:true});
setDim(is3d); applyRot();

function open(c){ buzz(8);
  const go=()=>{ sel=c; drawTiles(); drawCard(); document.getElementById('card').classList.add('open'); };
  if (document.startViewTransition && !timer) document.startViewTransition(go); else go(); }

  document.getElementById('date').textContent = fmtD(DATA.national[day].d); document.getElementById('slider').value=day; }
const slider=document.getElementById('slider'); slider.max=N-1;
slider.addEventListener('input',()=>{ day=+slider.value; render(); });
const play=document.getElementById('play');
const stop=()=>{ clearInterval(timer); timer=null; play.textContent='▶ 重播'; };
play.addEventListener('click',()=>{ if(timer){stop();return;} day=0; play.textContent='❚❚ 暫停';
  timer=setInterval(()=>{ day++; render(); if(day>=N-1) stop(); },70); });
let lw=innerWidth; addEventListener('resize',()=>{ if(innerWidth!==lw){ lw=innerWidth; drawCard(); } });
document.getElementById('days').textContent = Math.round((new Date(DATA.eday)-new Date(DATA.today))/864e5);
document.getElementById('upd').textContent = fmtD(DATA.today);

// ===== 互動細節 =====
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };   // 手機觸覺回饋
// 數字滾動
const shown={};
function countTo(id,to){ const el=document.getElementById(id), from=shown[id]??to-6; shown[id]=to;
  if (timer){ el.textContent=pct(to)+'%'; return; }
  const t0=performance.now(), dur=650;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=pct(from+(to-from)*e)+'%'; if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step); }
// 游標聚光
document.addEventListener('pointermove',e=>{ for (const el of document.querySelectorAll('.rope,.card')){ const r=el.getBoundingClientRect();
  el.style.setProperty('--mx',(e.clientX-r.left)+'px'); el.style.setProperty('--my',(e.clientY-r.top)+'px'); } });
// 指令面板：/ 或 Ctrl/⌘+K 搜尋縣市與候選人
const pal=document.getElementById('palette'), q=document.getElementById('q'), qres=document.getElementById('qres'); let qi=0, qlist=[];
function openPal(){ pal.hidden=false; q.value=''; filt(); setTimeout(()=>q.focus(),0); }
function closePal(){ pal.hidden=true; }
function filt(){ const v=q.value.trim();
  qlist=C.filter(c=>!v || c.includes(v) || DATA.races[c].cands.some(k=>k.n.includes(v)));
  qi=0; qres.innerHTML=qlist.map((c,i)=>{ const s=DATA.races[c].series[day];
    return `<li role="option" data-c="${c}" aria-selected="${i===qi}"><span>${c}</span><span class="m">${esc(s.lead)} 領先・勝率 ${Math.round(s.wp*100)}%</span></li>`; }).join('');
  qres.querySelectorAll('li').forEach(li=>li.addEventListener('click',()=>{ closePal(); open(li.dataset.c); })); }
q.addEventListener('input',filt);
q.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); qi=(qi+(e.key==='ArrowDown'?1:-1)+qlist.length)%qlist.length;
    qres.querySelectorAll('li').forEach((li,i)=>li.setAttribute('aria-selected',i===qi)); qres.children[qi]?.scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter' && qlist[qi]){ closePal(); open(qlist[qi]); } else if(e.key==='Escape') closePal(); });
pal.addEventListener('click',e=>{ if(e.target===pal) closePal(); });
document.getElementById('find').addEventListener('click',openPal);
// 鍵盤：← → 換日、空白鍵播放、/ 搜尋、Esc 關閉
document.addEventListener('keydown',e=>{
  if (!pal.hidden || e.target.tagName==='INPUT' && e.target.type!=='range') return;
  if (e.key==='/' || (e.key.toLowerCase()==='k' && (e.metaKey||e.ctrlKey))){ e.preventDefault(); openPal(); }
  else if (e.key==='ArrowLeft'||e.key==='ArrowRight'){ if(e.target.type==='range') return; day=Math.max(0,Math.min(N-1,day+(e.key==='ArrowRight'?1:-1))); render(); }
  else if (e.key===' ' && e.target===document.body){ e.preventDefault(); play.click(); }
  else if (e.key==='Escape'){ document.getElementById('card').classList.remove('open'); } });
// 月初觸覺提示
slider.addEventListener('input',()=>{ if (DATA.national[day].d.endsWith('-01')) buzz(12); });

render();
// 開場：柱子依序升起
requestAnimationFrame(()=>{ intro=false; const ts=[...tiles.querySelectorAll('.tile')];
  ts.forEach((t,i)=>t.style.transitionDelay=(i*35)+'ms'); drawTiles();
  setTimeout(()=>ts.forEach(t=>t.style.transitionDelay=''),1600); });
addEventListener('resize',()=>drawTiles());
</script>

</body>
