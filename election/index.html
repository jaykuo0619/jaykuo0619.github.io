  <h1>封關期間暫停</h1>
  <p>依《公職人員選舉罷免法》第 53 條，投票日前十日起至投票截止前，不得發布、報導、散布、評論或引述民意調查資料。</p>
  <p>本站於 <strong>11/18 00:00 至 11/28 16:00</strong> 暫停顯示所有民調與預測內容，<strong>11/28 16:00 投票截止後恢復</strong>。</p>
